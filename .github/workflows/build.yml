name: Full RealmForge Build 1.21.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract complete RealmForge source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="RealmForge-Merged-Build-Ready-compilefix3.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Full source ZIP is missing!"
            ls -lah
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          echo "Source extracted."
          echo "Project files:"
          ls -lah extracted

      - name: Locate project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          FILE=$(find extracted -type f \
            -name build.gradle \
            -not -path '*/.gradle/*' \
            -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: build.gradle not found!"
            exit 1
          fi

          DIR=$(dirname "$FILE")

          if [ ! -f "$DIR/gradlew" ]; then
            echo "ERROR: Gradle wrapper missing!"
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Project directory: $DIR"

      - name: Verify Java and Gradle
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          java -version
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --version

      - name: Compile all Java source files
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          ./gradlew compileJava --no-daemon --stacktrace

      - name: Process mod resources
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          ./gradlew processResources --no-daemon

      - name: Build complete mod
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          ./gradlew clean build --no-daemon --stacktrace

      - name: Verify generated JAR
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated mod files:"
          find build/libs -maxdepth 1 -type f -name '*.jar' -ls

          JAR=$(find build/libs -maxdepth 1 \
            -type f -name '*.jar' \
            ! -name '*-sources.jar' \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "ERROR: No mod JAR was generated!"
            exit 1
          fi

          echo "Mod JAR successfully generated: $JAR"

      - name: Upload complete compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Full-Mod-1.21.1
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
