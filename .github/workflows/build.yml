
name: Build RealmForge

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Find RealmForge ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          preferred="RealmForge-Skills-Gameplay-Update.zip"

          if [ -f "$preferred" ]; then
            best="$preferred"
          else
            best=""
            for z in *.zip; do
              [ -f "$z" ] || continue
              if [[ "$z" == *RealmForge* ]]; then
                best="$z"
                break
              fi
            done
          fi

          if [ -z "$best" ]; then
            echo "RealmForge ZIP not found in repository root."
            ls -la
            exit 1
          fi

          echo "Using $best"
          echo "name=$best" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q -o "${{ steps.zip.outputs.name }}" -d project

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          f=$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/__MACOSX/*' | head -n 1)

          if [ -z "$f" ]; then
            echo "ERROR: No Gradle settings file found."
            find project -maxdepth 4 -type f | head -200
            exit 1
          fi

          dir=$(dirname "$f")
          echo "Project directory: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Check Gradle files
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "ERROR: build.gradle or build.gradle.kts missing."
            ls -la
            exit 1
          fi

          echo "Gradle project found."

      - name: Build RealmForge
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          gradle build --no-daemon --stacktrace

      - name: Upload RealmForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge
          path: |
            ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
