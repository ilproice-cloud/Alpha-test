name: Build RealmForge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RealmForge 1.21.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Extract the source ZIP from the repository
      - name: Extract RealmForge source
        shell: bash
        run: |
          ZIP_FILE="RealmForge-PrimePiece-Skill-Test-Update.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found: $ZIP_FILE"
            ls -lah
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/realmforge-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/realmforge-source"

          echo "Extracted source files:"
          find "$RUNNER_TEMP/realmforge-source" -maxdepth 3 -type f | head -100

      # Find the actual Gradle build file
      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          SOURCE="$RUNNER_TEMP/realmforge-source"

          BUILD_FILE=$(find "$SOURCE" -maxdepth 10 -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::No build.gradle found inside extracted ZIP"
            find "$SOURCE" -maxdepth 8 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Found project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # Copy the libraries already stored in the repository
      - name: Install repository libraries
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          mkdir -p libs
          cp "$GITHUB_WORKSPACE"/libs/*.jar libs/

          echo "Libraries available to Gradle:"
          ls -lh libs/

      # Build the mod
      - name: Build RealmForge
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon --stacktrace
          else
            gradle build --no-daemon --stacktrace
          fi

      # Upload the compiled mod
      - name: Upload RealmForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-1.21.1
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
