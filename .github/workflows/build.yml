name: Build RealmForge

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Locate project
        id: project
        shell: bash
        run: |
          if [ -f "./gradlew" ] || [ -f "./build.gradle" ] || [ -f "./build.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "./realmforge-neoforge/gradlew" ] || [ -f "./realmforge-neoforge/build.gradle" ] || [ -f "./realmforge-neoforge/build.gradle.kts" ]; then
            echo "dir=realmforge-neoforge" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Could not find Gradle project."
            find . -maxdepth 3 \( -name build.gradle -o -name build.gradle.kts -o -name gradlew \)
            exit 1
          fi

      - name: Build RealmForge
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean build
          else
            gradle --no-daemon clean build
          fi

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Build
          path: |
            ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
