name: Build RealmForge Electro Visual Integration

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-disabled: true

      - name: Extract RealmForge source ZIP
        shell: bash
        run: |
          ZIP="RealmForge-Electro-Visual-Integration-1.21.1.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found!"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          echo "ZIP extracted successfully."
          echo "Searching for Gradle project..."

          find extracted -type f \
            \( -name build.gradle -o -name build.gradle.kts \)

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          FILE=$(find . -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path '*/.gradle/*' \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No build.gradle found after extraction!"
            echo "Repository files:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          echo "Found Gradle project: $DIR"

      - name: Build RealmForge
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          gradle clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Electro-Visual-Integration-1.21.1
          path: |
            ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
