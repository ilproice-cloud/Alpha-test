
name: Build RealmForge

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Locate RealmForge project
        id: project
        shell: bash
        run: |
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f realmforge-neoforge/settings.gradle ] || [ -f realmforge-neoforge/settings.gradle.kts ]; then
            echo "dir=realmforge-neoforge" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Gradle project not found!"
            exit 1
          fi

      - name: Verify libraries
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          echo "Checking libs folder..."
          ls -lh libs/

          if ! compgen -G "libs/*.jar" > /dev/null; then
            echo "ERROR: No library JARs found in libs/"
            exit 1
          fi

      - name: Build RealmForge
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-1.21.1
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
