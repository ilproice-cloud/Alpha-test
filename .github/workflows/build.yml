
name: Build RealmForge

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Find RealmForge ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          preferred="RealmForge-Skills-Gameplay-Update.zip"

          if [ -f "$preferred" ]; then
            best="$preferred"
          else
            best=""
            for z in *.zip; do
              [ -f "$z" ] || continue
              if [[ "$z" == *RealmForge* ]]; then
                best="$z"
                break
              fi
            done
          fi

          if [ -z "$best" ]; then
            echo "ERROR: RealmForge ZIP not found."
            ls -la
            exit 1
          fi

          echo "Using: $best"
          echo "name=$best" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q -o "${{ steps.zip.outputs.name }}" -d project

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          f=$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/__MACOSX/*' | head -n 1)

          if [ -z "$f" ]; then
            echo "ERROR: settings.gradle not found."
            find project -maxdepth 4 -type f
            exit 1
          fi

          dir=$(dirname "$f")
          echo "Found project: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Check Gradle files
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail

          test -f build.gradle || test -f build.gradle.kts

          echo "Gradle project verified."

      - name: Fix NeoForge 1.21.1 API errors
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="src/main/java/com/realmforge/addon/client/KillerArmorClient.java"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: KillerArmorClient.java not found."
            exit 1
          fi

          # Correct RegisterClientExtensionsEvent package
          sed -i \
            's|net\.neoforged\.neoforge\.client\.event\.RegisterClientExtensionsEvent|net.neoforged.neoforge.client.extensions.common.RegisterClientExtensionsEvent|g' \
            "$FILE"

          # Correct Minecraft EntityModelSet accessor
          sed -i \
            's/getEntityModelSet()/getEntityModels()/g' \
            "$FILE"

          echo "Checking fixes..."

          grep -n "RegisterClientExtensionsEvent" "$FILE"
          grep -n "getEntityModels()" "$FILE"

          if grep -q "client.event.RegisterClientExtensionsEvent" "$FILE"; then
            echo "ERROR: Old event import remains."
            exit 1
          fi

          if grep -q "getEntityModelSet()" "$FILE"; then
            echo "ERROR: Old model accessor remains."
            exit 1
          fi

          echo "API compatibility patches applied."

      - name: Verify skill source files
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          echo "Checking RealmForge source..."

          find src/main/java -type f \
            | grep -Ei 'Barrage|HeavyPunch|Uppercut|Skill' || true

          echo "Source inspection complete."

      - name: Build RealmForge
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle build --no-daemon --stacktrace

      - name: Upload RealmForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Skills
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
