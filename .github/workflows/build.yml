
@echo off
title RealmForge Electro Visual Integration - Build
color 0B

echo ==========================================
echo  RealmForge Electro Visual Integration
echo ==========================================
echo.

where java >nul 2>nul
if errorlevel 1 (
    echo ERROR: Java is not installed or not in PATH.
    echo Install JDK 21 first.
    pause
    exit /b 1
)

java -version

if not exist "gradlew.bat" (
    echo ERROR: gradlew.bat was not found.
    echo Extract this script into the project root folder.
    pause
    exit /b 1
)

echo.
echo Cleaning old build...
call gradlew.bat clean

if errorlevel 1 goto failed

echo.
echo Building RealmForge...
call gradlew.bat build

if errorlevel 1 goto failed

echo.
echo ==========================================
echo BUILD SUCCESSFUL!
echo ==========================================
echo.
echo Check the build\libs folder for the JAR.
explorer "build\libs"
pause
exit /b 0

:failed
echo.
echo ==========================================
echo BUILD FAILED!
echo Check the errors above.
echo ==========================================
pause
exit /b 1
