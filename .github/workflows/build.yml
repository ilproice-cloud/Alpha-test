name: Build RealmForge
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Unzip project
        run: unzip -q -o RealmForge-Uppercut-Update.zip -d project

      - name: Locate project
        id: project
        shell: bash
        run: |
          f=$(find project -name settings.gradle | head -n 1)
          if [ -z "$f" ]; then
            echo "No settings.gradle found in the zip:"
            find project -maxdepth 3
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Patch source fixes
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          J=src/main/java/com/realmforge
          sed -i 's/\bFormatting\.\.\./ChatFormatting.../' \
            $J/addon/client/EffectsPage.java \
            $J/addon/client/BookPages.java \
            $J/client/RpgBook.java
          sed -i 's/net\.neoforged\.neoforge\.client\.event\.RegisterClientExtensionsEvent/net.neoforged.neoforge.client.extensions.common.RegisterClientExtensionsEvent/; s/getEntityModelSet()/getEntityModels()/' \
            $J/addon/client/KillerArmorClient.java

      - name: Build
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: realmforge-jar
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
