name: RealmForge Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract RealmForge source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="RealmForge-PrimePiece-Skill-Test-Update.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE was not found in the repository."
            echo "Repository files:"
            ls -la
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/realmforge-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/realmforge-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/realmforge-source" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find "$RUNNER_TEMP/realmforge-source" -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find a Gradle project in the ZIP."
            find "$RUNNER_TEMP/realmforge-source" -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Copy required libraries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_DIR/libs"

          if [ -d "$GITHUB_WORKSPACE/libs" ]; then
            cp -f "$GITHUB_WORKSPACE"/libs/*.jar "$PROJECT_DIR/libs/" 2>/dev/null || true
          fi

          echo "Libraries in project:"
          ls -lh "$PROJECT_DIR/libs" || true

      - name: Apply Minecraft and NeoForge compatibility fixes
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          project = Path(os.environ["PROJECT_DIR"])
          java_dir = project / "src" / "main" / "java"

          if not java_dir.exists():
              print("WARNING: Java source directory was not found.")
              raise SystemExit(0)

          def patch_file(filename, replacements):
              matches = list(java_dir.rglob(filename))

              if not matches:
                  print(f"Not found: {filename}")
                  return

              for path in matches:
                  content = path.read_text(encoding="utf-8")
                  original = content

                  for old, new in replacements:
                      content = content.replace(old, new)

                  if content != original:
                      path.write_text(content, encoding="utf-8")
                      print(f"Patched: {path}")
                  else:
                      print(f"No changes needed: {path}")

          def replace_formatting(filename):
              matches = list(java_dir.rglob(filename))

              for path in matches:
                  content = path.read_text(encoding="utf-8")
                  original = content

                  content = re.sub(r"\bFormatting\b", "ChatFormatting", content)

                  if "ChatFormatting" in content and "import net.minecraft.ChatFormatting;" not in content:
                      package_match = re.search(r"(?m)^package\s+[^;]+;", content)
                      if package_match:
                          insert_at = package_match.end()
                          content = (
                              content[:insert_at]
                              + "\n\nimport net.minecraft.ChatFormatting;"
                              + content[insert_at:]
                          )

                  if content != original:
                      path.write_text(content, encoding="utf-8")
                      print(f"Updated formatting references: {path}")

          for filename in ("EffectsPage.java", "BookPages.java", "RpgBook.java"):
              replace_formatting(filename)

          patch_file(
              "KillerArmorClient.java",
              [
                  (
                      "net.neoforged.neoforge.client.event.RegisterClientExtensionsEvent",
                      "net.neoforged.neoforge.client.extensions.common.RegisterClientExtensionsEvent",
                  ),
                  (
                      "getEntityModelSet()",
                      "getEntityModels()",
                  ),
              ],
          )
          PY

      - name: Make Gradle wrapper executa
