name: Build RealmForge
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Find newest zip
        id: zip
        shell: bash
        run: |
          best=""; bestt=0
          for z in *.zip; do
            [ -e "$z" ] || continue
            t=$(git log -1 --format=%ct -- "$z")
            if [ "$t" -gt "$bestt" ]; then bestt=$t; best=$z; fi
          done
          if [ -z "$best" ]; then
            echo "No zip found in repo root:"
            ls -la
            exit 1
          fi
          echo "Using: $best"
          echo "name=$best" >> "$GITHUB_OUTPUT"

      - name: Unzip project
        run: unzip -q -o "${{ steps.zip.outputs.name }}" -d project

      - name: Locate project
        id: project
        shell: bash
        run: |
          f=$(find project -name settings.gradle | head -n 1)
          if [ -z "$f" ]; then
            echo "No settings.gradle found in the zip:"
            find project -maxdepth 3
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Patch source fixes
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          for n in EffectsPage BookPages RpgBook; do
            for f in $(find src -name "$n.java"); do
              sed -i 's/\bFormatting\.\.\./ChatFormatting.../' "$f"
            done
          done
          for f in $(find src -name KillerArmorClient.java); do
            sed -i 's/net\.neoforged\.neoforge\.client\.event\.RegisterClientExtensionsEvent/net.neoforged.neoforge.client.extensions.common.RegisterClientExtensionsEvent/; s/getEntityModelSet()/getEntityModels()/' "$f"
          done

      - name: Build
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: realmforge-jar
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
