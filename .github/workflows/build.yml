name: Build RealmForge

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract RealmForge source
        run: |
          unzip -o RealmForge-SkillBook-UI-Fix.zip -d extracted

      - name: Find Gradle project
        run: |
          cd extracted
          find . -name build.gradle -o -name build.gradle.kts

      - name: Build mod
        run: |
          cd extracted
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Fixed
          path: extracted/build/libs/*.jar
          if-no-files-found: error
