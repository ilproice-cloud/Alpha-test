name: Build RealmForge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RealmForge 1.21.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          GRADLE_FILE=$(find . -maxdepth 10 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path "*/.git/*" \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::No Gradle settings file found."
            echo "Repository files:"
            find . -maxdepth 6 -type f | head -250
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          PROJECT_DIR=${PROJECT_DIR#./}

          echo "Found project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify project
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "::error::build.gradle not found"
            exit 1
          fi

          echo "Gradle project:"
          pwd

          echo "Project files:"
          ls -la

          echo "Libraries:"
          if [ -d libs ]; then
            ls -lh libs/
          else
            echo "::error::libs folder not found"
            exit 1
          fi

          if ! find libs -maxdepth 1 -name "*.jar" -type f | grep -q .; then
            echo "::error::No library JAR files found"
            exit 1
          fi

      - name: Build RealmForge
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon --stacktrace
          else
            gradle build --no-daemon --stacktrace
          fi

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-1.21.1
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
