
name: Build RealmForge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RealmForge 1.21.1
    runs-on: ubuntu-latest

    steps:
      # 1. Get repository files
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 3. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # 4. Extract RealmForge source
      - name: Extract RealmForge source
        shell: bash
        run: |
          ZIP_FILE="RealmForge-PrimePiece-Skill-Test-Update.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found: $ZIP_FILE"
            ls -lah
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/realmforge-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/realmforge-source"

          echo "Source extracted successfully."

      # 5. Locate Gradle project
      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          SOURCE="$RUNNER_TEMP/realmforge-source"

          BUILD_FILE=$(find "$SOURCE" -maxdepth 10 -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::No build.gradle found in source ZIP"
            find "$SOURCE" -maxdepth 8 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")

          echo "Found project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 6. Install existing Photon and LDLib2 libraries
      - name: Install repository libraries
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          mkdir -p libs

          if ! compgen -G "$GITHUB_WORKSPACE/libs/*.jar" > /dev/null; then
            echo "::error::No libraries found in repository libs folder"
            exit 1
          fi

          cp "$GITHUB_WORKSPACE"/libs/*.jar libs/

          echo "Installed libraries:"
          ls -lh libs/

      # 7. Fix Minecraft 1.21.1 compatibility errors
      - name: Fix source compatibility
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = [
              "src/main/java/com/realmforge/addon/client/EffectsPage.java",
              "src/main/java/com/realmforge/addon/client/BookPages.java",
              "src/main/java/com/realmforge/client/RpgBook.java",
          ]

          for name in files:
              p = Path(name)

              if not p.exists():
                  raise SystemExit(f"Missing source file: {name}")

              s = p.read_text()
              s = s.replace("Formatting", "ChatFormatting")

              if "import net.minecraft.ChatFormatting;" not in s:
                  lines = s.splitlines()
                  index = next(
                      i + 1 for i, line in enumerate(lines)
                      if line.startswith("package ")
                  )
                  lines.insert(index, "")
                  lines.insert(
                      index + 1,
                      "import net.minecraft.ChatFormatting;"
                  )
                  s = "\n".join(lines) + "\n"

              p.write_text(s)
              print(f"Fixed: {name}")

          name = "src/main/java/com/realmforge/addon/client/KillerArmorClient.java"
          p = Path(name)

          if not p.exists():
              raise SystemExit(f"Missing source file: {name}")

          s = p.read_text()

          s = s.replace(
              "net.neoforged.neoforge.client.event.RegisterClientExtensionsEvent",
              "net.neoforged.neoforge.client.extensions.common.RegisterClientExtensionsEvent"
          )

          s = s.replace(
              "getEntityModelSet()",
              "getEntityModels()"
          )

          p.write_text(s)
          print(f"Fixed: {name}")
          PY

      # 8. Build RealmForge
      - name: Build RealmForge
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon --stacktrace
          else
            gradle build --no-daemon --stacktrace
          fi

      # 9. Upload compiled mod
      - name: Upload RealmForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-1.21.1
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
