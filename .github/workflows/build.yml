name: Build RealmForge Electro Visual Integration

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP if needed
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if find . -path './.git' -prune -o -type f -name build.gradle -print | grep -q .; then
            BG=$(find . -path './.git' -prune -o -type f -name build.gradle -print | head -n 1)
            DIR=$(dirname "$BG")
          else
            ZIP=$(find . -maxdepth 2 -type f -iname 'RealmForge-Merged-Build-Ready.zip' -print -quit)

            if [ -z "$ZIP" ]; then
              ZIP=$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)
            fi

            if [ -z "$ZIP" ]; then
              echo 'ERROR: No Gradle project or source ZIP found.'
              exit 1
            fi

            mkdir -p extracted
            unzip -oq "$ZIP" -d extracted

            BG=$(find extracted -type f -name build.gradle -print -quit)

            if [ -z "$BG" ]; then
              echo 'ERROR: ZIP extracted but build.gradle was not found.'
              find extracted -maxdepth 4 -type f | head -100
              exit 1
            fi

            DIR=$(dirname "$BG")
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $DIR"

      - name: Build RealmForge with Gradle wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            echo 'ERROR: Gradle wrapper (gradlew) is missing.'
            exit 1
          fi

          sed -i 's/\r$//' gradlew
          chmod +x gradlew

          ./gradlew clean build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Merged-1.21.1
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
