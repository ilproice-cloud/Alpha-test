
name: Build RealmForge Electro Visual Integration

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Find project folder
        id: project
        shell: bash
        run: |
          if [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "realmforge-neoforge/build.gradle" ] || [ -f "realmforge-neoforge/build.gradle.kts" ]; then
            echo "dir=realmforge-neoforge" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: build.gradle not found!"
            exit 1
          fi

      - name: Build mod
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle clean build --no-daemon

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-Electro-Visual-Integration-1.21.1
          path: |
            ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
