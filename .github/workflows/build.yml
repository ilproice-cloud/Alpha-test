name: Build RealmForge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Extract RealmForge Source
        id: project
        shell: bash
        run: |
          set -e

          SOURCE="$RUNNER_TEMP/realmforge-source"
          mkdir -p "$SOURCE"

          echo "Looking for Gradle project..."

          PROJECT=$(find "$GITHUB_WORKSPACE" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' -print -quit)

          if [ -z "$PROJECT" ]; then
            ZIP=$(find "$GITHUB_WORKSPACE" -maxdepth 2 \
              -type f -name '*.zip' -print -quit)

            if [ -z "$ZIP" ]; then
              echo "ERROR: No source ZIP found!"
              exit 1
            fi

            echo "Extracting: $ZIP"
            unzip -q "$ZIP" -d "$SOURCE"

            PROJECT=$(find "$SOURCE" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Gradle project not found after extraction!"
            find "$SOURCE" -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Project found: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Photon and LDLib2
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e
          mkdir -p libs

          if compgen -G "$GITHUB_WORKSPACE/libs/*.jar" > /dev/null; then
            cp -n "$GITHUB_WORKSPACE"/libs/*.jar libs/ || true
          fi

          echo "Available libraries:"
          ls -lh libs/

          ls libs/*photon*.jar
          ls libs/*ldlib2*.jar

      - name: Build RealmForge
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          gradle build --no-daemon --stacktrace

      - name: Upload RealmForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-1.21.1
          path: ${{ steps.project.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error

