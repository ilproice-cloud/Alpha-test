name: Build RealmForge
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # Picks the zip in the repo root that was committed most recently.
      # If several zips share the same commit time, the one with the newest name (alphabetically last) wins.
      - name: Find newest zip
        id: zip
        shell: bash
        run: |
          best=""; bestt=-1
          for z in *.zip; do
            [ -e "$z" ] || continue
            t=$(git log -1 --format=%ct -- "$z")
            t=${t:-0}
            echo "  $z  (commit time $t)"
            if [ "$t" -ge "$bestt" ]; then bestt=$t; best=$z; fi
          done
          if [ -z "$best" ]; then
            echo "No zip found in repo root:"
            ls -la
            exit 1
          fi
          echo "Using: $best"
          echo "name=$best" >> "$GITHUB_OUTPUT"

      - name: Unzip project
        run: |
          rm -rf project
          unzip -q -o "${{ steps.zip.outputs.name }}" -d project

      - name: Locate project
        id: project
        shell: bash
        run: |
          f=$(find project -name settings.gradle -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "No settings.gradle found in the zip:"
            find project -maxdepth 3
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      # No Photon / LDLib2 / extra jars needed: everything comes from NeoForge via build.gradle.
      # Small NeoForge 1.21.1 API fixes (safe to re-run).
      - name: Patch source fixes
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          # Old Yarn-style "Formatting" -> Mojang "ChatFormatting" (no-op if already fixed)
          for f in $(grep -rlE '(^|[^A-Za-z])Formatting\.' src --include=*.java || true); do
            sed -i -E 's/(^|[^A-Za-z])Formatting\./\1ChatFormatting./g' "$f"
          done

          for f in $(find src -name KillerArmorClient.java); do
            sed -i 's/net\.neoforged\.neoforge\.client\.event\.RegisterClientExtensionsEvent/net.neoforged.neoforge.client.extensions.common.RegisterClientExtensionsEvent/; s/getEntityModelSet()/getEntityModels()/' "$f"
            grep -n "RegisterClientExtensionsEvent;\|getEntityModels" "$f" || true
          done

      - name: Sanity check new content is in the zip
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          # Informational only: confirms the newest files made it into this build.
          for f in \
            src/main/java/com/realmforge/addon/logic/SkillManager.java \
            src/main/java/com/realmforge/addon/client/AddonBooks.java \
            src/main/java/com/realmforge/addon/entity/VfxEntities.java \
            src/main/java/com/realmforge/client/SkillBarHud.java \
            src/main/resources/assets/realmforge/textures/gui/skills/skill_bar_mirrored.png \
            src/main/resources/assets/realmforge/skills/geo/quest_board.geo.json; do
            [ -f "$f" ] && echo "found   $f" || echo "MISSING $f (this zip is older than the skill bar update)"
          done

      - name: Check project has no external jars needed
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if grep -rIl "com\.lowdragmc\|photon" src build.gradle >/dev/null 2>&1; then
            echo "WARNING: this project references Photon/LDLib2; it needs jars in libs/."
            ls -la libs 2>/dev/null || true
          fi

      - name: Build
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle clean build --no-daemon --stacktrace

      - name: Show built jars
        working-directory: ${{ steps.project.outputs.dir }}
        run: ls -la build/libs

      - uses: actions/upload-artifact@v4
        with:
          name: realmforge-jar
          path: |
            ${{ steps.project.outputs.dir }}/build/libs/*.jar
            !${{ steps.project.outputs.dir }}/build/libs/*-sources.jar
          if-no-files-found: error
