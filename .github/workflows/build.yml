name: Build RealmForge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build RealmForge 1.21.1
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 21
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 3. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # 4. Find the actual Gradle project
      - name: Locate RealmForge project
        id: project
        shell: bash
        run: |
          echo "Searching repository for Gradle project..."

          GRADLE_FILE=$(find . -maxdepth 7 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path "*/.gradle/*" \
            -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::Could not find settings.gradle or settings.gradle.kts"
            echo "Repository structure:"
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          PROJECT_DIR=${PROJECT_DIR#./}

          echo "Gradle project found: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 5. Check required project files and libraries
      - name: Verify project and libraries
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          echo "Checking project..."

          if [ ! -f build.gradle ] && [ ! -f build.gradle.kts ]; then
            echo "::error::Build script not found"
            exit 1
          fi

          if [ ! -d libs ]; then
            echo "::error::libs folder not found"
            exit 1
          fi

          echo "Libraries found:"
          find libs -maxdepth 1 -type f -name "*.jar" -printf "%f\n"

          if ! find libs -maxdepth 1 -type f -name "*.jar" | grep -q .; then
            echo "::error::No JAR libraries found in libs/"
            exit 1
          fi

      # 6. Make Gradle wrapper executable if present
      - name: Prepare Gradle wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      # 7. Build mod
      - name: Build RealmForge
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            ./gradlew build --no-daemon --stacktrace
          else
            gradle build --no-daemon --stacktrace
          fi

      # 8. Find and upload compiled JAR
      - name: Upload RealmForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-1.21.1
          path: |
            ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
