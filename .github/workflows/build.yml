name: Build RealmForge
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Unzip project
        run: unzip -q -o RealmForge-Uppercut-NoParticles-Animation-Fix.zip -d project

      - name: Locate project
        id: project
        shell: bash
        run: |
          f=$(find project -name settings.gradle | head -n 1)
          if [ -z "$f" ]; then
            echo "No settings.gradle found in the zip:"
            find project -maxdepth 3
            exit 1
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Patch source fixes
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          # compile fixes
          for n in EffectsPage BookPages RpgBook; do
            for f in $(find src -name "$n.java"); do
              sed -i 's/\bFormatting\.\.\./ChatFormatting.../' "$f"
            done
          done
          for f in $(find src -name KillerArmorClient.java); do
            sed -i 's/net\.neoforged\.neoforge\.client\.event\.RegisterClientExtensionsEvent/net.neoforged.neoforge.client.extensions.common.RegisterClientExtensionsEvent/; s/getEntityModelSet()/getEntityModels()/' "$f"
          done
          # hat layer follows the head
          for f in $(find src -name HumanoidModelMixin.java); do
            sed -i 's|public ModelPart leftArm;|&\n   @Shadow @Final public ModelPart hat;\n   @Shadow @Final public ModelPart head;|' "$f"
            sed -i 's|AnimClient.apply((HumanoidModel<?>)(Object)this, entity.getUUID());|&\n      this.hat.copyFrom(this.head);|' "$f"
          done
          # animation: absolute poses, ease in/out, slowed to 0.65x
          cat > /tmp/patch_anim.py <<'PYEOF'
          import re, sys, pathlib
          p = pathlib.Path(sys.argv[1]); s = p.read_text()
          s = s.replace(" / 16.0F;", ";")
          s = re.sub(r"\(v\[([0-2])\] - base\[[0-2]\]\)", r"v[\1]", s)
          s = re.sub(r"(ROT_SIGN\[[0-2]\])\)", r"\1 * w)", s)
          s = re.sub(r"(POS_SIGN\[[0-2]\]);", r"\1 * w;", s)
          anchor = "      float[] v = new float[3];\n"
          assert anchor in s, "anchor missing"
          s = s.replace(anchor, "      float w = Math.min(1.0F, Math.min(t / 0.08F, (a.clip.length - t) / 0.2F));\n      w = w * w * (3.0F - 2.0F * w);\n" + anchor, 1)
          assert "speed <= 0.0F ? 1.0F : speed" in s, "speed anchor missing"
          s = s.replace("speed <= 0.0F ? 1.0F : speed", "0.65F")
          p.write_text(s)
          PYEOF
          for f in $(find src -name AnimClient.java); do
            python3 /tmp/patch_anim.py "$f"
            sed -i "s|ROT_SIGN = new float\[\]{[^}]*}|ROT_SIGN = new float[]{1.0F, 1.0F, 1.0F}|; s|POS_SIGN = new float\[\]{[^}]*}|POS_SIGN = new float[]{0.0F, 0.0F, 0.0F}|" "$f"
            grep -n "_SIGN = \|0.65F" "$f"
          done

      - name: Build
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: realmforge-jar
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
