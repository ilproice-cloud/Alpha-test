name: Build RealmForge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Find Gradle Project
        id: locate
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          FILE=$(find . -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -not -path '*/.gradle/*' -not -path '*/build/*' -print -quit)

          if [ -z "$FILE" ]; then
            echo "ERROR: No Gradle project found!"
            find . -maxdepth 5 -type f
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "Found project in: $DIR"
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build RealmForge
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          echo "Building RealmForge..."
          gradle build --no-daemon --stacktrace

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-1.21.1
          path: '**/build/libs/*.jar'
          if-no-files-found: error
