name: Build RealmForge Compile Fix

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract compile-fix ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="RealmForge-Merged-Build-Ready-compilefix.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found!"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          echo "ZIP extracted successfully."

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          FILE=$(find extracted -type f \
            -name build.gradle \
            -not -path '*/.gradle/*' \
            | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No build.gradle found!"
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

          echo "Found Gradle project: $DIR"

      - name: Build RealmForge
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload RealmForge JAR
        uses: actions/upload-artifact@v4
        with:
          name: RealmForge-CompileFix-1.21.1
          path: ${{ steps.project.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
